name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tidal-garden/package-lock.json
            bunny-burrows/package-lock.json
            tiny-isles/package-lock.json
            flower-patch/package-lock.json

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Install Tidal Garden dependencies
        working-directory: tidal-garden
        run: npm ci --no-audit --no-fund

      - name: Build Tidal Garden
        working-directory: tidal-garden
        run: npm run build

      - name: Publish Tidal Garden under /tidal-garden/
        run: cp -R tidal-garden/dist dist/tidal-garden

      - name: Install Bunny Burrows dependencies
        working-directory: bunny-burrows
        run: npm ci --no-audit --no-fund

      - name: Test Bunny Burrows
        working-directory: bunny-burrows
        run: npm test

      - name: Build Bunny Burrows
        working-directory: bunny-burrows
        run: npm run build

      - name: Publish Bunny Burrows under /bunny-burrows/
        run: cp -R bunny-burrows/dist dist/bunny-burrows

      - name: Install Tiny Isles dependencies
        working-directory: tiny-isles
        run: npm ci --no-audit --no-fund

      - name: Test Tiny Isles
        working-directory: tiny-isles
        run: npm test

      - name: Build Tiny Isles
        working-directory: tiny-isles
        run: npm run build

      - name: Publish Tiny Isles under /tiny-isles/
        run: cp -R tiny-isles/dist dist/tiny-isles

      - name: Install Flower Patch dependencies
        working-directory: flower-patch
        run: npm ci --no-audit --no-fund

      - name: Test Flower Patch
        working-directory: flower-patch
        run: npm test

      - name: Build Flower Patch
        working-directory: flower-patch
        run: npm run build

      - name: Publish Flower Patch under /flower-patch/
        run: cp -R flower-patch/dist dist/flower-patch

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
