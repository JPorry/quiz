name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            bunny-burrows/package-lock.json
            hamster-hideaway/package-lock.json

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Install Bunny Burrows dependencies
        working-directory: bunny-burrows
        run: npm ci --no-audit --no-fund

      - name: Test Bunny Burrows
        working-directory: bunny-burrows
        run: npm test

      - name: Build Bunny Burrows
        working-directory: bunny-burrows
        run: npm run build

      - name: Publish Bunny Burrows under /bunny-burrows/
        run: cp -R bunny-burrows/dist dist/bunny-burrows

      - name: Install Hamster Hideaway dependencies
        working-directory: hamster-hideaway
        run: npm ci --no-audit --no-fund

      - name: Test Hamster Hideaway
        working-directory: hamster-hideaway
        run: npm test

      - name: Verify Hamster Hideaway's daily puzzles
        working-directory: hamster-hideaway
        run: npm run verify:levels

      - name: Build Hamster Hideaway
        working-directory: hamster-hideaway
        run: npm run build

      - name: Publish Hamster Hideaway under /hamster-hideaway/
        run: cp -R hamster-hideaway/dist dist/hamster-hideaway

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
