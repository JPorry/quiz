<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Hamster Hideaway: logo</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; background: transparent; }
  /* Renders the title logo. Capture #logo (900×520, transparent) and save it as public/title-logo.webp. */
  #logo { position: relative; width: 900px; height: 520px; }
  .word {
    position: absolute; left: 0; right: 0; text-align: center; margin: 0;
    font: 700 168px/1 'Fredoka', sans-serif; letter-spacing: 2px;
    color: #fff1c9; -webkit-text-stroke: 26px #5a3626; paint-order: stroke fill;
    text-shadow: 0 14px 0 #3e2418;
  }
  .word span { display: inline-block; }
  .one { top: 70px; }
  .two { top: 270px; font-size: 150px; color: #bfe6f6; }
  .one span:nth-child(odd) { transform: translateY(-6px) rotate(-3deg); }
  .one span:nth-child(even) { transform: translateY(4px) rotate(2deg); }
  .two span:nth-child(odd) { transform: translateY(5px) rotate(2deg); }
  .two span:nth-child(even) { transform: translateY(-4px) rotate(-2deg); }
  .face { position: absolute; width: 150px; left: 680px; top: -2px; transform: rotate(12deg); filter: drop-shadow(0 8px 0 rgba(62, 36, 24, .35)); }
  .seed { position: absolute; width: 52px; left: 92px; top: 30px; transform: rotate(-24deg); filter: drop-shadow(0 6px 0 rgba(62, 36, 24, .35)); }
</style>
</head>
<body>
<div id="logo">
  <h1 class="word one"><span>H</span><span>a</span><span>m</span><span>s</span><span>t</span><span>e</span><span>r</span></h1>
  <h1 class="word two"><span>H</span><span>i</span><span>d</span><span>e</span><span>a</span><span>w</span><span>a</span><span>y</span></h1>
  <svg class="seed" viewBox="0 0 24 36"><ellipse cx="12" cy="18" rx="10" ry="16" fill="#4a3a30" stroke="#2a1d17" stroke-width="2.2"/><path d="M12 4v28" stroke="#f0e3c8" stroke-width="3" stroke-linecap="round"/></svg>
  <svg class="face" viewBox="0 0 64 64">
    <circle cx="17" cy="16" r="8" fill="#f5a65b" stroke="#5a3626" stroke-width="2.6"/><circle cx="17" cy="16" r="4.2" fill="#f7aeb4"/>
    <circle cx="47" cy="16" r="8" fill="#f5a65b" stroke="#5a3626" stroke-width="2.6"/><circle cx="47" cy="16" r="4.2" fill="#f7aeb4"/>
    <ellipse cx="32" cy="36" rx="24" ry="21" fill="#f5a65b" stroke="#5a3626" stroke-width="2.8"/>
    <ellipse cx="32" cy="43" rx="15" ry="12" fill="#fff3e2"/>
    <circle cx="23.5" cy="32" r="3.4" fill="#2a1d17"/><circle cx="24.5" cy="30.8" r="1.1" fill="#fff"/>
    <circle cx="40.5" cy="32" r="3.4" fill="#2a1d17"/><circle cx="41.5" cy="30.8" r="1.1" fill="#fff"/>
    <ellipse cx="16" cy="40" rx="4.5" ry="3" fill="#f79a9a" opacity=".85"/><ellipse cx="48" cy="40" rx="4.5" ry="3" fill="#f79a9a" opacity=".85"/>
    <ellipse cx="32" cy="38" rx="2.4" ry="1.7" fill="#e88a8a"/>
    <path d="M28.5 41.5q3.5 3 7 0" stroke="#5a3626" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  </svg>
</div>
</body>
</html>
