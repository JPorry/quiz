<!doctype html>
<html><head><meta charset="utf-8"><title>City lineup</title>
<style>html,body{margin:0;width:1400px;height:640px;overflow:hidden;background:#8fd8e6}</style></head>
<body><script type="module">
import * as THREE from 'three'
import { City, makeIsland } from '../src/city.js'
const W = 1400, H = 640
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true })
renderer.setSize(W, H); renderer.setPixelRatio(1.5)
renderer.shadowMap.enabled = true
renderer.outputColorSpace = THREE.SRGBColorSpace
renderer.setClearColor(0x8fd8e6)
document.body.append(renderer.domElement)
const scene = new THREE.Scene()
scene.add(new THREE.HemisphereLight(0xf2f8ff, 0x9fd6cf, 1.5))
const sun = new THREE.DirectionalLight(0xfff1dc, 1.9); sun.position.set(-5, 10, 6); sun.castShadow = true
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -10, right: 10, top: 10, bottom: -10 }); scene.add(sun)
const water = new THREE.Mesh(new THREE.PlaneGeometry(60, 60).rotateX(-Math.PI / 2), new THREE.MeshLambertMaterial({ color: 0x7fd3e0 }))
water.position.y = -0.02; water.receiveShadow = true; scene.add(water)
const zoom = 1.25
const camera = new THREE.OrthographicCamera(-zoom * W / H, zoom * W / H, zoom, -zoom, 0.1, 100)
const elev = 38 * Math.PI / 180
camera.position.set(Number(new URLSearchParams(location.search).get("x") ?? 0), Math.sin(elev) * 30, Math.cos(elev) * 30); camera.lookAt(Number(new URLSearchParams(location.search).get("x") ?? 0), 0.4, 0)
const cities = []
for (let t = 0; t <= 8; t++) {
  const rad = 0.52
  const g = new THREE.Group()
  g.position.set((t - 4) * 1.32, 0, 0)
  g.add(makeIsland(rad, t + 3))
  const c = new City(t + 1)
  c.group.scale.setScalar(rad)
  c.group.position.y = 0.1
  g.add(c.group)
  c.setTier(t)
  cities.push(c)
  scene.add(g)
}
for (let s = 0; s < 120; s++) cities.forEach((c) => c.update(1 / 30))
renderer.render(scene, camera)
window.__done = true
</script></body></html>
