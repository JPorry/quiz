<!doctype html>
<html><head><meta charset="utf-8"><title>Bunny lineup</title>
<style>html,body{margin:0;width:1200px;height:700px;overflow:hidden;background:#f3d3a3}</style></head>
<body><script type="module">
import * as THREE from 'three'
import { Bunny, lookFor, seedLooks } from '../src/bunny.js'
const p = new URLSearchParams(location.search)
const W = 1200, H = 700
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true })
renderer.setSize(W, H); renderer.setPixelRatio(1.5)
renderer.shadowMap.enabled = true
renderer.outputColorSpace = THREE.SRGBColorSpace
renderer.setClearColor(0xf3d3a3)
document.body.append(renderer.domElement)
const scene = new THREE.Scene()
scene.add(new THREE.HemisphereLight(0xfff4e6, 0xc9a07a, 1.6))
const sun = new THREE.DirectionalLight(0xfff1d6, 1.8); sun.position.set(-3, 6, 8); sun.castShadow = true
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8 }); scene.add(sun)
const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40).rotateX(-Math.PI / 2), new THREE.MeshLambertMaterial({ color: 0xf3d3a3 }))
ground.receiveShadow = true; scene.add(ground)
const zoom = Number(p.get('zoom') ?? 1.9)
const camera = new THREE.OrthographicCamera(-zoom * W / H, zoom * W / H, zoom, -zoom, 0.1, 100)
const elev = Number(p.get('elev') ?? 14) * Math.PI / 180
camera.position.set(0, Math.sin(elev) * 20 + 0.75, Math.cos(elev) * 20); camera.lookAt(0, 0.75, 0)
seedLooks(Number(p.get('seed') ?? 5))
const looks = [
  { fur: 'snow', baby: false, ears: 'up', mark: 'none', acc: 'bow', accent: 0xff8fab },
  { fur: 'caramel', baby: false, ears: 'lop', mark: 'dutch', acc: 'none', accent: 0x8fc9ff },
  { fur: 'silver', baby: false, ears: 'flop', mark: 'patch', acc: 'glasses', accent: 0xffd166 },
  { fur: 'charcoal', baby: false, ears: 'up', mark: 'dutch', acc: 'scarf', accent: 0xff8fab },
  { fur: 'cream', baby: false, ears: 'up', mark: 'spots', acc: 'crown', accent: 0xc9a8ff },
  { fur: 'ginger', baby: true, ears: 'up', mark: 'blaze', acc: 'sprout', accent: 0xa8e6a1 },
  { fur: 'cocoa', baby: true, ears: 'lop', mark: 'none', acc: 'bow', accent: 0xffd166 },
  { fur: 'snow', baby: true, ears: 'up', mark: 'patch', acc: 'none', accent: 0x8fc9ff },
  { fur: 'cream', baby: false, ears: 'up', mark: 'none', acc: 'hat', accent: 0xff8fab },
  { fur: 'caramel', baby: true, ears: 'flop', mark: 'dutch', acc: 'none', accent: 0xffd166 },
].map((l, i) => ({ ...l, phase: i }))
const states = (p.get('states') ?? 'fed,wait,sleep,fed,wait,fed,sleep,wait,fed,sleep').split(',')
const bunnies = looks.map((look, i) => {
  const b = new Bunny(look)
  const row = Math.floor(i / 5), col = i % 5
  b.root.position.set((col - 2) * 1.25, 0, row * -0.1)
  b.root.position.y = 0
  if (row) b.root.position.x += 0
  b.root.scale.setScalar(look.baby ? 1 : 1)
  b.root.rotation.y = (col - 2) * -0.08
  b.setState(states[i], true)
  scene.add(b.root)
  return { b, row }
})
// rows: second row sits lower on screen
bunnies.forEach(({ b, row }) => { if (row) { b.root.position.y = -1.6 } })
ground.position.y = -10
for (let s = 0; s < 90; s++) bunnies.forEach(({ b }) => b.update(1 / 60))
camera.position.y -= 0.8; camera.lookAt(0, -0.05, 0)
renderer.render(scene, camera)
window.__done = true
</script></body></html>
